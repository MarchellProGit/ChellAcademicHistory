<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ringkasan Pemesanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .extended-bg {
        height: 150vh;
        background-color: white;
        position: relative;
      }
      .custom-rectangle {
        width: 100%;
        height: 620px;
        background-color: #7BB0FF;
        border-radius: 0 0 29px 29px;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
      }
      .inner-rectangle {
        width: 95%;
        height: 90%;
        background-color: white;
        border-radius: 29px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .inner-rectangle img {
        width: 93%;
        height: 90%;
        border-radius: 29px;
      }
      .container-1 {
        margin-top: 20px;
        width: 90%;
        max-width: 1200px;
        display: flex;
        justify-content: space-between;
        margin-left: 50px; /* Added to shift the entire container to the right */
      }
      .harga, .ringkasan-pemesanan-1 {
        border-radius: 20px;
        border: 2px solid #7BB0FF;
        background: rgba(123, 176, 255, 0.33);
        padding: 20px;
        box-sizing: border-box;
        width: 650px;
        height: 170px;
      }
      .harga {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-right: 10px;
        margin-left: 30px;
      }
      .harga .container {
        display: flex;
        flex-direction: column;
      }
      .harga .jek-id {
        font-weight: 600;
        font-size: 25px;
        color: #000000;
      }
      .harga .menit {
        font-weight: 400;
        font-size: 25px;
        color: #6F6F6F;
      }
      .harga .rp-15000 {
        font-weight: 500;
        position: absolute;
        font-size: 24px;
        color: #000000;
        right: 690px;
      }
      .ringkasan-pemesanan-1 {
        display: flex;
        flex-direction: column;
        margin-left: 20px; /* Added to shift the position further to the right */
      }
      .ringkasan-pemesanan {
        font-weight: 700;
        font-size: 18px;
        color: #000000;
        margin-bottom: 10px;
      }
      .penjemputan-universitas-kristen-satya-wacana-tujuan-fti-uksw-jarak-37-km-metode-pembayaran-tunai {
        font-weight: 400;
        font-size: 15px;
        color: #000000;
      }
      .kembali {
        overflow-wrap: break-word;
        position: relative;
        font-family: 'Inter';
        font-weight: 500;
        font-size: 22px;
        color: #FFFFFF;
        left: 130px;
      }
      .tombol-kembali {
        height: 50px;
        bottom: 30px;
        left: 180px;
        border-radius: 10px;
        border: 2px solid #FFFFFF;
        background: #000000;
        position: relative;
        display: flex;
        padding: 5px 1px 5px 0;
        width: 353px;
        box-sizing: border-box;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      }
      .tombol-kembali:hover {
        background-color: #FFFFFF;
        border-color: #000000;
      }
      .tombol-kembali:hover .kembali {
        color: #000000;
      }
      .lanjut {
        position: relative;
        left: 135px;
        overflow-wrap: break-word;
        font-family: 'Inter';
        font-weight: 500;
        font-size: 22px;
        color: #FFFFFF;
      }
      .tombol-lanjut {
        height: 50px;
        left: 30px;
        bottom: 30px;
        border-radius: 10px;
        background: #7BB0FF;
        border: 2px solid #7BB0FF;
        position: relative;
        display: flex;
        padding: 5px 1px 5px 0;
        width: 353px;
        box-sizing: border-box;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      }
      .tombol-lanjut:hover {
        background-color: #FFFFFF;
        border-color: #7BB0FF;
      }
      .tombol-lanjut:hover .lanjut {
        color: #7BB0FF;
      }
      .container-2 {
        margin-left: 6px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        width: 1062px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="p-3 mb-2 text-primary-emphasis extended-bg">
      <div class="custom-rectangle">
        <div class="inner-rectangle">
          <img src="IMG/maprute.png" alt="Maps">
        </div>
      </div>
      <div class="container-1">
        <div class="harga">
          <div class="container">
            <div class="jek-id">
              JEK.ID
            </div>
            <span class="menit">
              3-7 Menit
            </span>
          </div>
          <div class="rp-15000">
            Rp. 15.000
          </div>
        </div>
        <div class="ringkasan-pemesanan-1">
          <span class="ringkasan-pemesanan">
            Ringkasan Pemesanan:
          </span>
          <span class="penjemputan-universitas-kristen-satya-wacana-tujuan-fti-uksw-jarak-37-km-metode-pembayaran-tunai">
            Penjemputan: Universitas Kristen Satya Wacana<br />
            Tujuan: FTI UKSW<br />
            Jarak: 3,7 km<br />
            Metode Pembayaran: Tunai
          </span>
        </div>
      </div>
    </div>
    <div class="container-2">
      <button class="tombol-kembali" onclick="goToDriver2()">
        <span class="kembali">
        Kembali
        </span>
      </button>
      <button class="tombol-lanjut" onclick="goToDriver4()">
        <span class="lanjut">
        Pesan
        </span>
      </button>
    </div>

    <script>
      function goToDriver2() {
        window.location.href = 'driver2.html';
      }
      function goToDriver4() {
        window.location.href = 'driver4.html';
      }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></script>
  </body>
</html>

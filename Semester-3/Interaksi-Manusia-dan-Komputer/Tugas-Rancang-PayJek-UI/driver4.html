          <div class="universitas-kristen-satya-wacana">
            Universitas Kristen Satya Wacana
          </div>
        </div>
        <div class="cari-lokasi-tujuan">
          <div class="icon-cari-lokasi-tujuan">

      <div class="container-9">

        <div class="container-7">

    <div id="imgPopup" class="popup">
      <div class="popup-content">
        <img src="IMG/pchatIrfan.png" alt="Pop-up Image" />
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const popup = document.querySelector('.popup');
        const popupContent = document.querySelector('.popup-content');
    
        // Fungsi untuk menampilkan pop-up
        function showPopup() {
          popup.style.display = 'flex';
        }
    
        // Fungsi untuk menyembunyikan pop-up
        function hidePopup(event) {
          if (event.target === popup) {
            popup.style.display = 'none';
          }
        }
    
        // Tambahkan event listener untuk menutup pop-up ketika klik di luar konten
        popup.addEventListener('click', hidePopup);
    
        // Contoh pemicu untuk menampilkan pop-up
        document.getElementById('show-popup-button').addEventListener('click', showPopup);

        // Event listener untuk tombol silang
        document.getElementById('close-button').addEventListener('click', function() {
          window.location.href = '12. beranda.html';
        });
      });
    </script>

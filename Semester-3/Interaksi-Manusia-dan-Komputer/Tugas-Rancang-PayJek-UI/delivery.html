<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="10. delivery.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <title>Delivery</title>
</head>

<body>
    <header class="navbar">
        <h1 class="fontjek">Jek.ID</h1>
        <p style="font-size: 30px; align-items: center; font-weight: bold; color: white;">Delivery</p>
        <div class="user">
            <i class='bx bxs-user-circle'></i>
        </div>
    </header>

    <div class="delibox">
        <h2>Masukan info barang</h2>
        <p>masukan foto barang</p>
        <div class="kamera">
            <i class='bx bx-camera'></i>
        </div>
        <p>masukan nama/isi barang</p>
        <div class="mskangka">
            <input class="angka-input" placeholder="masukan nama atau isi barang">
        </div>
        <div class="boximg">
            <img src="IMG/map.jpeg" alt="Foto Barang" style="width: 100%; height: 400px;">
        </div>
        <div class="inputdel">
            <input class="lokasi-input" placeholder="lokasi anda sekarang">
            <input class="lokasi-input" placeholder="lokasi tujuan">
        </div>
    </div>

    <div class="btnback">
        <button class="btnkembali">Kembali</button>
        <button class="btnlanjut">Lanjut</button>
    </div>

</body>
</html>

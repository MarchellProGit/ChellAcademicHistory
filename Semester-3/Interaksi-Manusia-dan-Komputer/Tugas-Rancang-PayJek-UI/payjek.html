<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="9. payjek.css">

<body>
    <header class="navbar">
        <h1 class="fontjek">Jek.ID</h1>

        <div class="user">

    <div class="paybox">

        </div>
        <div class="btnbox">
            <button class="btn">listrik</button>

            <button class="btn">dana</button>
        </div>
        <div class="boxing">
            <p>masukan angka nominal untuk bayar</p>
        </div>
        <div class="mskangka">
            <input class="angka-input" placeholder="Masukkan nominal">
        </div>
    </div>
    <div class="btnback">
        <button class="btnkembali">Kembali</button>
        <button class="btnlanjut">Lanjut</button>
    </div>

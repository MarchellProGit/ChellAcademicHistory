<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jek.ID Login</title>
    <link rel="stylesheet" href="2. sign_in.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a class="header-brand">Jek.ID</a>
        </div>
    </header>

    <section class="hero">
        <div class="auth-content">
            <h2 class="subtitle">MASUK</h2>
            <form id="login-form">
                <div class="input-group">
                    <img src="VECTOR/vector_47_x2.svg" alt="Phone Icon" class="icon">
                    <input type="tel" id="phone" placeholder="Phone" required>
                </div>
                <div class="input-group password-group">
                    <img src="VECTOR/vector_50_x2.svg" alt="Password Icon" class="icon">
                    <input type="password" id="password" placeholder="Password" required>
                    <img src="VECTOR/vector_62_x2.svg" alt="Show Password" class="toggle-password" id="toggle-password">
                </div>
                <a href="#" class="forgot-password" id="forgot-password">Forgot Password?</a>
                <a href="12. beranda.html" class="login-button">Masuk </a>
            </form>
            <div class="divider"> or </div>
            <div class="auth-links">
                <button class="google-login">
                    <img src="IMG/pngwing_1.png" alt="Google Icon"> Sign in with Google
                </button>
                <button class="signup">
                    Don't have an account? <a href="3. sign_up.html"> Sign up</a>
                </button>
            </div>
            <div class="download-links">
                <a href="#"><img src="IMG/image_31.png" alt="Google Play"></a>
                <a href="#"><img src="IMG/image_7.png" alt="App Store"></a>
            </div>
        </div>
    </section>

    <!-- Forgot Password Overlay -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>Forgot Password</h2>
            <p>Enter your email to reset your password:</p>
            <form id="forgot-password-form">
                <div class="input-group">
                    <input type="email" id="reset-email" placeholder="Your email" required>
                </div>
                <button type="submit" class="submit-button">Send Reset Link</button>
                <button type="button" class="close-overlay" id="close-overlay">Close</button>
            </form>
        </div>
    </div>

    <!-- Reset Password Notification -->
    <div id="reset-notification" class="notification" style="display: none;">
        <p>A reset link has been sent to your email.</p>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <a href="6. help.html" class="footer-link">Help</a>
            <a href="#" class="footer-link">Terms of Service</a>
            <a href="8. privasi.html" class="footer-link">Privacy Policy</a>
            <a href="#" class="footer-link">Manage Cookies</a>
        </div>
        <div class="footer-copy">
            <p>© 2024 Kelompok 3 - IMK A</p>
        </div>
    </footer>

    <script src="2. sign_in.js"></script>
</body>
</html>
